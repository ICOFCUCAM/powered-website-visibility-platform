[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visibility-hub-api"
version = "0.1.0"
description = "Visibility Hub — API and workers"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "pyjwt>=2.9",
    "pydantic>=2.8",
    "httpx>=0.27",
    "cryptography>=43",
    "redis>=5.0",
    "anthropic>=1.7",
    "celery[redis]>=5.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-httpx>=0.30",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "import-linter>=2.0",
    "ruff>=0.6",
]

# Only `api` is a Python package; db/, docs/, scripts/ and web/ are not.
[tool.setuptools.packages.find]
include = ["api*"]

[tool.pytest.ini_options]
testpaths = ["api/tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.importlinter]
root_packages = ["api"]
# Required to forbid third-party modules (supabase, psycopg, googleapiclient).
include_external_packages = true

# --- The architectural contracts from docs/08-architecture.md --------------
# These are the boundary. A violation fails CI rather than waiting for a
# reviewer to notice an import that autocomplete added.

[[tool.importlinter.contracts]]
name = "Domain layer is vendor-neutral"
type = "forbidden"
source_modules = ["api.domain"]
forbidden_modules = [
    "supabase", "gotrue", "postgrest", "storage3",
    "psycopg", "psycopg_pool", "fastapi", "starlette",
]

[[tool.importlinter.contracts]]
name = "Only the Hub may construct a Google API client"
type = "forbidden"
source_modules = [
    "api.domain", "api.routers", "api.repositories",
    "api.adapters", "api.deps", "api.main", "api.workers",
]
# `api.workers` is in that list deliberately. The nightly sync is the obvious
# place for a worker to start building its own client "just for the scheduler";
# instead it calls the Hub's `sync_website`, which constructs, uses and
# discards the client itself.
#
# Top-level packages only: import-linter rejects subpackages of external
# packages. `google` covers google.oauth2, google.auth and google.analytics,
# which is the intent anyway — no Google client of any kind outside the Hub.
forbidden_modules = ["googleapiclient", "google", "google_auth_oauthlib"]

# The documented boundary (docs/08-architecture.md) forbids the Hub importing
# PRODUCT logic: crawler, scoring, recommendations, dashboard, competitors. It
# deliberately does not forbid the shared tenancy layer — authentication,
# membership and the website record are platform primitives every module needs,
# and denying them would force the Hub to duplicate auth rather than decouple.
[[tool.importlinter.contracts]]
name = "The Hub does not import product logic"
type = "forbidden"
source_modules = ["api.hub"]
forbidden_modules = [
    "api.routers", "api.crawler", "api.analysis", "api.ai", "api.reports",
    "api.workers",
]

# The scheduler decides WHEN, never WHAT. Everything it runs is code the API
# already exercises, so a nightly job and a button press cannot drift apart —
# and nothing in the request path may reach into the worker layer to make
# something happen inline.
[[tool.importlinter.contracts]]
name = "The request path does not import the workers"
type = "forbidden"
source_modules = [
    "api.routers", "api.repositories", "api.domain", "api.adapters", "api.deps",
    "api.hub", "api.analysis", "api.crawler", "api.ai", "api.reports",
]
forbidden_modules = ["api.workers"]

# The other direction, which matters more for extraction: the core must never
# reach into the Hub. api.main is excluded because it is the composition root —
# mounting the Hub's routers is exactly its job.
[[tool.importlinter.contracts]]
name = "The core does not import the Hub"
type = "forbidden"
source_modules = [
    "api.routers", "api.repositories", "api.domain", "api.adapters", "api.deps",
]
forbidden_modules = ["api.hub"]

# The same shape as the Google rule, for the same reason: a boundary nobody
# can cross by accident is worth more than a convention everybody agrees with.
[[tool.importlinter.contracts]]
name = "Only the AI layer may call a language model"
type = "forbidden"
source_modules = [
    "api.domain", "api.routers", "api.repositories", "api.adapters",
    "api.analysis", "api.crawler", "api.hub", "api.reports", "api.deps",
    "api.main", "api.workers",
]
forbidden_modules = ["anthropic"]
# Direct imports only. Reaching the SDK *through* api.ai is the design — the
# report runner asks the AI layer for a plan and gets structured data back.
# What this forbids is any other module constructing a client, choosing a
# model or shaping a request, which is the thing that would make the model
# unswappable and the layer untestable.
allow_indirect_imports = true

# Detection is deterministic and must stay that way. A rule that called a model
# would make "this is fixed" an opinion, break the fingerprint lifecycle, and
# put a per-page API call inside a 500-page crawl. The AI layer reads the
# analysis layer; it is never the other way round.
[[tool.importlinter.contracts]]
name = "Detection is deterministic: analysis and the crawler never call the AI layer"
type = "forbidden"
source_modules = ["api.analysis", "api.crawler"]
forbidden_modules = ["api.ai", "api.reports"]

[[tool.importlinter.contracts]]
name = "Domain does not depend on delivery or persistence"
type = "layers"
layers = ["api.routers", "api.deps", "api.repositories", "api.adapters", "api.domain"]
exhaustive = false
