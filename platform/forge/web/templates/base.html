<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Forge{% endblock %}</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/static/forge.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>&#9878;</text></svg>">
</head>
<body>
{% if show_nav %}
<header class="masthead">
  <div class="masthead-inner">
    <a class="wordmark" href="/">forge<span>/</span></a>
    <nav>
      <a href="/">Projects</a>
      <a href="/logout">Sign out</a>
    </nav>
  </div>
</header>
{% endif %}

<main class="page">
  {% if ok %}<div class="notice notice-ok">{{ ok }}</div>{% endif %}
  {% if err %}<div class="notice notice-bad">{{ err }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>

{% block scripts %}{% endblock %}
</body>
</html>
