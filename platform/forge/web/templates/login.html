{% extends "base.html" %}
{% block title %}Sign in — Forge{% endblock %}
{% block content %}
<div class="login">
  <span class="wordmark">forge<span>/</span></span>
  <p class="tagline">Deployments, on hardware you own.</p>

  {% if err %}<div class="notice notice-bad">{{ err }}</div>{% endif %}

  <div class="card">
    <div class="card-body">
      <form method="post" action="/login">
        <div class="field field-mono">
          <label for="token">API token</label>
          <input type="password" id="token" name="token" autofocus
                 autocomplete="current-password" required>
          <div class="hint">The value of <span class="mono">FORGE_API_TOKEN</span>.</div>
        </div>
        <button class="btn btn-primary" type="submit">Sign in</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
