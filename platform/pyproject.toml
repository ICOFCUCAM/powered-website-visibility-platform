[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge"
version = "0.1.0"
description = "Forge — a self-hosted deployment platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.8",
    "httpx>=0.27",
    "cryptography>=43",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "import-linter>=2.0",
    "ruff>=0.6",
]

[project.scripts]
forge = "forge.cli:main"

[tool.setuptools.packages.find]
include = ["forge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.importlinter]
root_packages = ["forge"]
include_external_packages = true

# --- Architectural contracts -----------------------------------------------
# The boundary, enforced in CI rather than in review.

[[tool.importlinter.contracts]]
name = "The domain layer knows no vendor"
type = "forbidden"
source_modules = ["forge.domain"]
# Detection and Dockerfile generation are pure functions over a directory.
# Once they can reach the database or the Docker daemon, "what would this
# repository build as?" stops being answerable without both running.
forbidden_modules = [
    "psycopg", "psycopg_pool", "fastapi", "starlette", "httpx", "docker",
    "forge.adapters", "forge.repositories", "forge.engine", "forge.routers",
]

[[tool.importlinter.contracts]]
name = "Only the engine drives Docker and git"
type = "forbidden"
source_modules = ["forge.domain", "forge.repositories", "forge.routers"]
forbidden_modules = ["forge.adapters.containers", "forge.adapters.source"]
# Direct imports only. The engine is *supposed* to drive both, and a router is
# supposed to call the engine, so forbidding the chain would forbid the design.
# What this catches is a route or a query reaching past the engine to run a
# container itself, which is where the ordering guarantees in
# forge.engine.promote quietly stop applying.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Layers run one way"
type = "layers"
layers = [
    "forge.main",
    "forge.web",
    "forge.routers",
    "forge.engine",
    "forge.repositories",
    "forge.adapters",
    "forge.domain",
]
exhaustive = false
